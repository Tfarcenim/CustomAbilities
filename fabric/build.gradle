plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")

    // The API of LambDynamicLights.
    // This is only required for compilation if you're using the Java API.
    modImplementation("dev.lambdaurora:lambdynamiclights:$dynamic_lights") {transitive = false}

    modImplementation include("dev.lambdaurora:spruceui:${project.spruceui}")

    // For runtime of LambDynamicLights.
    // Include only if you need to test in your dev env compatibility with LambDynamicLights.
    // Replace with modRuntimeOnly if you want the dependency to be transitive.
    //modLocalRuntime("dev.lambdaurora.lambdynamiclights:lambdynamiclights-runtime:$dynamic_lights")
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}
